<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Retro Threads</title>
 
    <style>
       

        
    
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap');

    body {
        font-family: 'Poppins', sans-serif;
        /* Purplish Gradient Background */
        background: linear-gradient(135deg, #4B2C5E 0%, #8E44AD 50%, #D8BFD8 100%);
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-card {
        background: rgba(255, 255, 255, 0.9); /* Glass effect */
        padding: 50px;
        border-radius: 30px;
        width: 380px;
        text-align: center;
        border: 4px solid #F3E5F5;
        box-shadow: 15px 15px 0px rgba(0, 0, 0, 0.2); /* Retro hard shadow */
    }

    h2 {
        font-family: 'Playfair Display', serif;
        color: #4B2C5E;
        font-size: 2.5rem;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 15px;
        margin-top: 15px;
        border: 2px solid #D8BFD8;
        border-radius: 12px;
        box-sizing: border-box;
        background: #FDFBFD;
    }

    input:focus {
        border-color: #8E44AD;
        outline: none;
        box-shadow: 0 0 8px rgba(142, 68, 173, 0.2);
    }

    .login-btn {
        background-color: #4B2C5E;
        color: white;
        border: none;
        padding: 15px;
        width: 100%;
        border-radius: 50px;
        margin-top: 30px;
        font-weight: bold;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-btn:hover {
        background-color: #8E44AD;
        transform: translateY(-3px);
    }

    a {
        color: #8E44AD;
        text-decoration: none;
        font-size: 0.9rem;
        display: block;
        margin-top: 15px;
    }
/* 1. Header (Navigation bar ka background handle karne ke liye) */
header {
    background: transparent;
    width: 100%;
    position: absolute; /* Is se nav bar background ke upar float karega */
    top: 0;
    padding: 20px 0;
}

/* 2. Navigation List Styling */
nav ul {
    list-style: none; /* Black dots khatam karne ke liye */
    padding: 0;
    margin: 0;
    display: flex; /* Links ko ek line mein lane ke liye */
    justify-content: center; /* Center mein karne ke liye */
    gap: 30px; /* Links ke darmiyan space */
}

/* 3. Links ka Color Change (White) */
nav ul li a {
    text-decoration: none;
    color: #FFFFFF; /* Pure White color taake purple background par saaf dikhe */
    font-weight: 600;
    text-transform: uppercase;
    font-size: 14px;
    letter-spacing: 1px;
    transition: 0.3s ease;
}

/* 4. Hover Effect */
nav ul li a:hover {
    color: #D8BFD8; /* Hover karne par light lavender ho jayega */
    transform: scale(1.1);
}
</style>
           
      
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="indexcloset.html">Home</a></li>
                <li><a href="logincloset.html">Login</a></li>
                <li><a href="signupcloset.html">Sign Up</a></li>
                <li><a href="contactcloset.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <div class="login-container">
        <h2>Welcome Back!</h2>
        <form>
            <label>Email</label>
            <input type="email" placeholder="hello@retro.com">
            <label>Password</label>
            <input type="password" placeholder="••••••••">
            <button type="submit" class="login-btn">Let's Go!</button>
        </form>
    </div>
</body>
</html>
