<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | Join Retro Threads</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap');

        /* 1. Full Page Styling */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #F3E5F5; /* Light Lavender Background */
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 2. Navigation Bar (Top) */
        header {
            background-color: #4B2C5E; /* Deep Purple */
            padding: 20px;
            text-align: center;
        }
        header h1 {
            color: white;
            font-family: 'Playfair Display', serif;
            margin: 0 0 10px 0;
        }
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        nav ul li a {
            text-decoration: none;
            color: #D8BFD8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
        }
        nav ul li a:hover { color: white; }

        /* 3. The Signup Card (Center) */
        .signup-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .signup-card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 30px;
            border: 3px solid #4B2C5E;
            box-shadow: 15px 15px 0px #D8BFD8; /* Aesthetic Shadow */
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: #4B2C5E;
            text-align: center;
            font-size: 2rem;
            margin-top: 0;
        }

        /* 4. Form Elements */
        label {
            display: block;
            margin-top: 20px;
            font-weight: 600;
            color: #4B2C5E;
            font-size: 14px;
        }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 2px solid #F3E5F5;
            border-radius: 12px;
            background-color: #FDFBFD;
            box-sizing: border-box; /* Important for alignment */
            font-family: 'Poppins', sans-serif;
        }

        .radio-box {
            background: #FDFBFD;
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
            border: 1px dashed #D8BFD8;
        }

        .register-btn {
            background-color: #4B2C5E;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 50px;
            margin-top: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn:hover {
            background-color: #8E44AD;
            transform: scale(1.02);
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }
        .login-link a { color: #8E44AD; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>E$M Closet</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <div class="signup-container">
        <main class="signup-card">
            <h2>Create Account</h2>
            <form>
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Maryam Saqib" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="maryam@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>

                <div class="radio-box">
                    <span style="font-size: 14px; font-weight: bold; color: #4B2C5E;">Style Preference:</span><br>
                    <input type="radio" id="minimalist" name="style" value="minimalist">
                    <label style="display:inline; margin-right: 15px; font-weight: normal;" for="minimalist">Minimalist</label>
                    
                    <input type="radio" id="vintage" name="style" value="vintage">
                    <label style="display:inline; font-weight: normal;" for="vintage">Vintage</label>
                </div>

                <div style="margin-top: 15px;">
                    <input type="checkbox" id="newsletter">
                    <label style="display:inline; font-weight: normal; font-size: 13px;" for="newsletter">Subscribe to Newsletter</label>
                </div>

                <button type="submit" class="register-btn">Register Now</button>
                
                <p class="login-link">Already have an account? <a href="login.html">Login here</a></p>
            </form>
        </main>
    </div>

</body>
</html>
